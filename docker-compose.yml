services:
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8004:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8000

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  telco-mcp:
    build: .
    command: python -m mcp_servers.telco_api.main
    ports:
      - "8001:8001"
    environment:
      - TELCO_BASE_URL=https://10.77.128.112:28701
      - TOKEN_URL=https://10.77.128.111:38443/apigovernance/tokens/aksk
      - APP_KEY=${APP_KEY}
      - APP_SECRET=${APP_SECRET}
    depends_on:
      - redis

  vector-mcp:
    build: .
    command: python -m mcp_servers.vector_db.main
    ports:
      - "8002:8002"
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      - chroma

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - telco-mcp
      - vector-mcp
    restart: unless-stopped

  mbb-mcp:
    build: .
    command: python -m mcp_servers.mbb_vector.main
    ports:
      - "8003:8003"
    environment:
      - VECTOR_DB_PROVIDER=chromadb
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      - chroma
    volumes:
      - ./logs:/app/logs
      - ./mbb_knowledge:/app/mbb_knowledge

  # OpenAI Proxy untuk convert format API
  openai-proxy:
    image: python:3.11-slim
    container_name: openai-proxy
    ports:
      - "8005:8005"
    volumes:
      - ./proxy_fixed.py:/app/proxy_fixed.py
      - ./requirements.txt:/app/requirements.txt
    working_dir: /app
    command: sh -c "pip install fastapi uvicorn httpx pydantic && python proxy_fixed.py"
    depends_on:
      - orchestrator
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      # Gunakan proxy yang sudah convert ke OpenAI format
      - OPENAI_API_BASE_URL=http://openai-proxy:8005/v1
      - OPENAI_API_KEY=dummy
      - WEBUI_SECRET_KEY=your-secret-key-here
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - openai-proxy
    restart: unless-stopped

volumes:
  open-webui: