[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telecom-mcp-ecosystem"
version = "0.1.0"
description = "MCP Servers for Telecom API and Vector DB"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "redis>=5.0.0",
    "loguru>=0.7.0",
    "google-generativeai>=0.3.0"
]

[tool.hatch.build.targets.wheel]
packages = ["shared", "mcp_servers", "orchestrator"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0"
]